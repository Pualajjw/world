<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>局域网聊天 · LAN Chat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234c86ff'/%3E%3Ccircle cx='10' cy='16' r='2' fill='white'/%3E%3Ccircle cx='16' cy='16' r='2' fill='white'/%3E%3Ccircle cx='22' cy='16' r='2' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <!-- 原型外壳：只有 demo 模式（prototype.html 或 ?demo=1）才显示，模拟 world 桌面里的应用窗口 -->
  <div class="lc-desktop" aria-hidden="true">
    <div class="lc-wall">
      <i class="lc-rib r1"></i><i class="lc-rib r2"></i><i class="lc-rib r3"></i>
      <i class="lc-rib r4"></i><i class="lc-rib r5"></i><i class="lc-core"></i>
    </div>
    <div class="lc-vignette"></div>
    <button class="lc-desktop-icon" id="lcDesktopIcon" type="button" title="双击打开 局域网聊天">
      <span class="lc-desktop-glyph">
        <svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true">
          <defs><linearGradient id="lcIconGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5aa9ff"/><stop offset="1" stop-color="#8268ff"/></linearGradient></defs>
          <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#lcIconGrad)"/>
          <path d="M12 16h24a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H22l-8 6v-6h-2a4 4 0 0 1-4-4V20a4 4 0 0 1 4-4z" fill="#fff" opacity=".95"/>
          <circle cx="19" cy="26" r="2" fill="#4b7bec"/><circle cx="26" cy="26" r="2" fill="#4b7bec"/><circle cx="33" cy="26" r="2" fill="#4b7bec"/>
        </svg>
      </span>
      <span>局域网聊天</span>
    </button>
    <div class="lc-taskbar">
      <div class="lc-taskbar-center">
        <button class="lc-start-button" type="button" title="开始" aria-label="开始">
          <svg width="19" height="19" viewBox="0 0 20 20" aria-hidden="true">
            <rect x="1" y="1" width="8" height="8" rx="1" fill="currentColor"/><rect x="11" y="1" width="8" height="8" rx="1" fill="currentColor"/>
            <rect x="1" y="11" width="8" height="8" rx="1" fill="currentColor"/><rect x="11" y="11" width="8" height="8" rx="1" fill="currentColor"/>
          </svg>
        </button>
        <button class="lc-taskbar-app on" id="lcTaskbarApp" type="button" title="局域网聊天 · 点击还原">
          <span class="lc-taskbar-dot"></span><span>局域网聊天</span>
        </button>
      </div>
      <div class="lc-taskbar-clock"><span id="lcClockTime">15:32</span><span id="lcClockDate">2026/11/6</span></div>
    </div>
  </div>

  <section class="lc-window" id="lcWindow" aria-label="局域网聊天窗口">
    <header class="lc-titlebar" id="lcTitlebar">
      <div class="lc-titlebar-brand">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-5 3.5V17H5.5A2.5 2.5 0 0 1 3 14.5v-8z" fill="#4cc2ff"/>
        </svg>
        <strong>局域网聊天</strong><em>LAN Chat</em>
      </div>
      <div class="lc-titlebar-controls">
        <button type="button" data-win="min" aria-label="最小化" title="最小化"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button type="button" data-win="max" aria-label="最大化" title="最大化"><svg width="10" height="10" viewBox="0 0 10 10"><rect x=".6" y=".6" width="8.8" height="8.8" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></button>
        <button type="button" data-win="close" class="lc-close" aria-label="关闭" title="关闭"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1.1"/></svg></button>
      </div>
    </header>

    <div class="lc-app" id="lcApp">
      <!-- 左栏：品牌 / 搜索 / 会话 / 我 -->
      <aside class="lc-sidebar">
        <div class="lc-brand">
          <span class="lc-brand-logo">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-5 3.5V17H5.5A2.5 2.5 0 0 1 3 14.5v-8z" fill="#fff" opacity=".96"/>
              <circle cx="9" cy="11" r="1.35" fill="#4b7bec"/><circle cx="13" cy="11" r="1.35" fill="#4b7bec"/><circle cx="17" cy="11" r="1.35" fill="#4b7bec"/>
            </svg>
          </span>
          <div class="lc-brand-text"><strong>局域网聊天</strong><span>LAN CHAT · 无需服务器</span></div>
        </div>

        <div class="lc-online-pill"><span class="lc-pulse"></span><strong id="lcOnlineCount">3 人在线</strong><span>· 同一局域网</span></div>

        <label class="lc-search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.6"/><path d="M16 16l4.5 4.5"/></svg>
          <input id="lcSearch" type="search" placeholder="搜索会话或成员" autocomplete="off" />
          <kbd>/</kbd>
        </label>

        <div class="lc-tabs" id="lcTabs" role="tablist" aria-label="会话分类">
          <button type="button" role="tab" aria-selected="true" data-tab="chats" class="on">消息</button>
          <button type="button" role="tab" aria-selected="false" data-tab="people">通讯录</button>
          <button type="button" role="tab" aria-selected="false" data-tab="groups">群聊</button>
        </div>

        <div class="lc-list" id="lcList"></div>

        <div class="lc-sidebar-foot">
          <button class="lc-new-group" id="lcNewGroup" type="button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            新建群聊
          </button>
          <button class="lc-me" id="lcMe" type="button" title="点击修改昵称">
            <span class="lc-avatar tone-me" id="lcMeAvatar">我</span>
            <span class="lc-me-text"><strong id="lcMyName">我</strong><span id="lcMyStatus">在线 · 本机</span></span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 20h4l10-10-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
          </button>
        </div>
      </aside>

      <!-- 中栏：会话头 / 消息 / 输入 -->
      <main class="lc-main">
        <header class="lc-chat-head" id="lcChatHead"></header>
        <div class="lc-messages" id="lcMessages"></div>
        <div class="lc-composer">
          <div class="lc-tools">
            <button type="button" data-tool="emoji" title="表情" aria-label="表情">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.7"/><path d="M8.4 14.1c.75 1.25 2 1.95 3.6 1.95s2.85-.7 3.6-1.95"/><circle cx="9.3" cy="9.7" r="1.05" fill="currentColor" stroke="none"/><circle cx="14.7" cy="9.7" r="1.05" fill="currentColor" stroke="none"/></svg>
            </button>
            <button type="button" data-tool="mention" title="@ 成员" aria-label="提到成员">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/></svg>
            </button>
            <button type="button" data-tool="quick" title="快捷语" aria-label="快捷语">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M13 2.8 4.9 13.3h5.5L9.8 21.2l8.3-10.7h-5.6z"/></svg>
            </button>
            <div class="lc-tools-spacer"></div>
            <span class="lc-typing" id="lcTyping"></span>
          </div>
          <div class="lc-input-row">
            <textarea id="lcInput" rows="1" placeholder="输入消息，Enter 发送…" maxlength="2000"></textarea>
            <button class="lc-send" id="lcSend" type="button" title="发送" aria-label="发送">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-3-6-7-2z"/></svg>
            </button>
          </div>
          <div class="lc-composer-hint">Enter 发送 · Shift + Enter 换行 · 消息仅在本局域网内传输</div>
        </div>
        <div class="lc-pop lc-emoji-pop" id="lcEmojiPop" hidden></div>
        <div class="lc-pop lc-quick-pop" id="lcQuickPop" hidden></div>
        <div class="lc-pop lc-mention-pop" id="lcMentionPop" hidden></div>
        <div class="lc-pop lc-session-pop" id="lcSessionPop" hidden></div>
      </main>

      <!-- 右栏：会话信息 / 成员 / 局域网发现 -->
      <aside class="lc-detail" id="lcDetail"></aside>
    </div>
  </section>

  <div class="lc-modal-root" id="lcModalRoot" hidden></div>
  <div class="lc-toast" id="lcToast" hidden></div>

  <script src="./markdown.js"></script>
  <script src="./app.js"></script>
</body>
</html>
