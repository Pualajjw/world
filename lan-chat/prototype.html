<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>局域网聊天 · 界面设计原型</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234c86ff'/%3E%3Ccircle cx='10' cy='16' r='2' fill='white'/%3E%3Ccircle cx='16' cy='16' r='2' fill='white'/%3E%3Ccircle cx='22' cy='16' r='2' fill='white'/%3E%3C/svg%3E" />
  <style>
/* 局域网聊天在独立 iframe 中运行，由 world 将 dsh 的主题别名同步进来。 */
:root {
  --lc-font: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
  color-scheme: light;
  --lc-accent: var(--dsw-alias-state-business-primary, #3b6ef6);
  --lc-accent-2: color-mix(in srgb, var(--lc-accent) 78%, white);
  --lc-accent-soft: var(--dsw-alias-interactive-bg-hover, #eaf0ff);
  --lc-bg: var(--dsw-alias-bg-base, #ffffff);
  --lc-sidebar: var(--dsw-alias-bg-layer-1, #f7f9fd);
  --lc-chat: var(--dsw-alias-bg-layer-1, #fbfcff);
  --lc-detail: var(--dsw-alias-bg-layer-1, #f8faff);
  --lc-line: var(--dsw-alias-border-l2, #e8edf6);
  --lc-text: var(--dsw-alias-label-primary, #17233c);
  --lc-muted: var(--dsw-alias-label-secondary, #7f8ca5);
  --lc-faint: var(--dsw-alias-label-tertiary, #a9b4c8);
  --lc-bubble-in: var(--dsw-alias-bg-layer-2, #ffffff);
  --lc-bubble-out: linear-gradient(135deg, var(--lc-accent) 0%, var(--lc-accent-2) 100%);
  --lc-shadow: 0 12px 34px rgba(30, 58, 110, .10);
  --lc-shadow-sm: 0 4px 14px rgba(30, 58, 110, .08);
  --lc-online: #22c58b;
  /* 浮起层 / 轨道 / 输入面：浅色下都是「比底色更白」，深色下是「比底色更亮」，
     这样选中态、Tab、搜索框在两个主题里方向一致（深色不会挖出一个黑洞）。 */
  --lc-raised: var(--dsw-alias-bg-layer-2, #ffffff);
  --lc-track: var(--dsw-alias-bg-layer-1, #eef1f8);
  --lc-field: var(--dsw-alias-bg-layer-2, #ffffff);
}
:root[data-theme="dark"] {
  color-scheme: dark;
}

html, body { height: 100%; }
body { margin: 0; font-family: var(--lc-font); background: var(--lc-bg); color: var(--lc-text); -webkit-font-smoothing: antialiased; }
.lc-app *, .lc-window *, .lc-desktop *, .lc-modal-root *, .lc-toast * { box-sizing: border-box; }
button, input, textarea { font-family: inherit; }
button { cursor: pointer; }
.lc-app button, .lc-titlebar button, .lc-desktop button { color: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--lc-faint) 55%, transparent); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- 原型外壳：world 桌面（固定深色，不随应用主题变化） ---------- */
.lc-desktop { display: none; }
body.lc-demo { overflow: hidden; background: #04101c; }
body.lc-demo .lc-desktop { display: block; }
.lc-wall {
  position: fixed; inset: 0; overflow: hidden;
  background: radial-gradient(58% 52% at 50% 48%, #0f4675 0%, rgba(9, 38, 64, 0) 72%),
    radial-gradient(120% 100% at 14% 4%, #10365f 0%, rgba(16, 54, 95, 0) 58%),
    linear-gradient(165deg, #082036 0%, #04101c 46%, #06182a 100%);
}
.lc-rib { position: absolute; left: 47%; top: 46%; width: 72vmin; height: 14vmin; border-radius: 50%; mix-blend-mode: screen; filter: blur(11px); }
.lc-rib.r1 { transform: rotate(-24deg) scale(1.1) translate(-8vmin, -12vmin); background: linear-gradient(90deg, transparent 4%, rgba(64, 186, 250, .78) 44%, transparent 96%); }
.lc-rib.r2 { transform: rotate(-18deg) scale(1.35) translate(6vmin, 4vmin); background: linear-gradient(90deg, transparent 8%, rgba(94, 122, 255, .55) 48%, transparent 94%); }
.lc-rib.r3 { transform: rotate(-32deg) scale(.9) translate(-18vmin, 14vmin); background: linear-gradient(90deg, transparent 6%, rgba(94, 232, 214, .42) 50%, transparent 96%); }
.lc-rib.r4 { transform: rotate(-12deg) scale(1.6) translate(12vmin, -20vmin); background: linear-gradient(90deg, transparent 10%, rgba(122, 92, 255, .38) 50%, transparent 92%); }
.lc-rib.r5 { transform: rotate(-27deg) scale(1.15) translate(20vmin, 18vmin); background: linear-gradient(90deg, transparent 8%, rgba(64, 186, 250, .45) 52%, transparent 94%); }
.lc-core { position: absolute; left: 50%; top: 48%; width: 42vmin; height: 42vmin; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(96, 196, 255, .20), transparent 70%); filter: blur(20px); }
.lc-vignette { position: fixed; inset: 0; background: radial-gradient(110% 90% at 50% 45%, transparent 45%, rgba(0, 0, 0, .55) 100%); }
.lc-desktop-icon {
  position: fixed; left: 18px; top: 58px; z-index: 2; width: 96px; padding: 8px 4px;
  display: grid; justify-items: center; gap: 7px; border: 0; border-radius: 6px; background: transparent;
  color: #fff; font-size: 12px; text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
}
.lc-desktop-icon:hover { background: rgba(255, 255, 255, .10); }
.lc-desktop-glyph { filter: drop-shadow(0 6px 12px rgba(0, 0, 0, .45)); }
.lc-taskbar {
  position: fixed; left: 0; right: 0; bottom: 0; height: 48px; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; padding: 0 14px;
  background: rgba(26, 26, 28, .78); backdrop-filter: blur(30px) saturate(1.7);
  border-top: 1px solid rgba(255, 255, 255, .10); color: #f4f6fa;
}
.lc-taskbar-center { display: flex; align-items: center; gap: 8px; }
.lc-start-button { width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 5px; background: transparent; color: #4cc2ff; }
.lc-start-button:hover { background: rgba(255, 255, 255, .10); }
.lc-taskbar-app { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 0; border-radius: 6px; background: rgba(255, 255, 255, .09); color: #f4f6fa; font-size: 12px; position: relative; }
.lc-taskbar-app.on::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 2px; height: 2px; border-radius: 2px; background: #4cc2ff; }
.lc-taskbar-app.is-min { opacity: .6; }
.lc-taskbar-dot { width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(135deg, #5aa9ff, #8268ff); }
.lc-taskbar-clock { display: grid; justify-items: end; font-size: 12px; line-height: 1.35; opacity: .9; }

/* ---------- 窗口 ---------- */
.lc-window { box-sizing: border-box; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(1200px, 94vw); height: min(760px, 88vh); z-index: 5; display: flex; flex-direction: column; overflow: hidden; border-radius: 14px; border: 1px solid rgba(255, 255, 255, .12); background: var(--lc-bg); box-shadow: 0 32px 80px rgba(0, 0, 0, .58); transition: transform .22s ease, opacity .22s ease, border-radius .18s ease; }
body.lc-win-min .lc-window { transform: translate(-50%, 118vh) scale(.86); opacity: 0; pointer-events: none; }
body.lc-win-closed .lc-window { display: none; }
body.lc-win-max.lc-demo .lc-window { left: 0; top: 0; transform: none; width: 100%; height: calc(100% - 48px); border-radius: 0; border: 0; }
body:not(.lc-demo) .lc-window { inset: 0; left: 0; top: 0; transform: none; width: 100%; height: 100%; border-radius: 0; border: 0; box-shadow: none; }
.lc-titlebar { display: none; flex: 0 0 38px; align-items: center; justify-content: space-between; padding-left: 14px; background: #202124; color: #eef1f6; border-bottom: 1px solid rgba(255, 255, 255, .08); }
body.lc-demo .lc-titlebar { display: flex; }
.lc-titlebar-brand { display: flex; align-items: center; gap: 9px; font-size: 12px; }
.lc-titlebar-brand strong { font-weight: 600; }
.lc-titlebar-brand em { font-style: normal; font-size: 11px; opacity: .5; letter-spacing: .4px; }
.lc-titlebar-controls { display: flex; height: 100%; }
.lc-titlebar-controls button { width: 46px; height: 100%; display: grid; place-items: center; border: 0; background: transparent; color: #eef1f6; }
.lc-titlebar-controls button:hover { background: rgba(255, 255, 255, .10); }
.lc-titlebar-controls .lc-close:hover { background: #c42b1c; }

/* ---------- 三栏骨架 ---------- */
.lc-app { flex: 1; min-height: 0; display: grid; grid-template-columns: 274px minmax(0, 1fr) 258px; background: var(--lc-bg); color: var(--lc-text); }
.lc-sidebar { display: flex; flex-direction: column; min-height: 0; background: var(--lc-sidebar); border-right: 1px solid var(--lc-line); }
.lc-main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--lc-chat); }
.lc-detail { min-width: 0; overflow-y: auto; padding: 14px; background: var(--lc-detail); border-left: 1px solid var(--lc-line); }
body.lc-detail-hidden .lc-app { grid-template-columns: 274px minmax(0, 1fr); }
body.lc-detail-hidden .lc-detail { display: none; }

/* ---------- 左栏 ---------- */
.lc-brand { display: flex; align-items: center; gap: 11px; padding: 18px 16px 10px; }
.lc-brand-logo { width: 38px; height: 38px; flex: 0 0 38px; display: grid; place-items: center; border-radius: 12px; background: linear-gradient(135deg, #4c86ff, #7a5cff); box-shadow: 0 8px 18px rgba(76, 134, 255, .32); }
.lc-brand-text { display: grid; gap: 2px; min-width: 0; }
.lc-brand-text strong { font-size: 15px; letter-spacing: .2px; }
.lc-brand-text span { font-size: 10px; color: var(--lc-faint); letter-spacing: .6px; }
.lc-icon-btn { width: 30px; height: 30px; margin-left: auto; flex: 0 0 30px; display: grid; place-items: center; border: 1px solid var(--lc-line); border-radius: 9px; background: var(--lc-field); color: var(--lc-muted); }
.lc-icon-btn:hover { color: var(--lc-accent); border-color: var(--lc-accent); }
/* 深色下把月亮换成太阳，按钮告诉你能切回去 */
.lc-online-pill { display: flex; align-items: center; gap: 6px; margin: 0 16px 12px; padding: 5px 9px; border-radius: 9px; background: color-mix(in srgb, var(--lc-online) 8%, var(--lc-bg)); font-size: 11px; color: var(--lc-muted); }
.lc-online-pill strong { color: var(--lc-text); font-weight: 600; }
.lc-pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--lc-online); box-shadow: 0 0 0 0 color-mix(in srgb, var(--lc-online) 55%, transparent); animation: lc-pulse 2.2s infinite; }
@keyframes lc-pulse { 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.lc-search { position: relative; display: flex; align-items: center; gap: 8px; margin: 0 16px 12px; padding: 0 10px; height: 36px; border: 1px solid var(--lc-line); border-radius: 11px; background: var(--lc-field); color: var(--lc-faint); transition: border-color .15s, box-shadow .15s; }
.lc-search:focus-within { border-color: var(--lc-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lc-accent) 14%, transparent); }
.lc-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--lc-text); font-size: 12px; }
.lc-search input::placeholder { color: var(--lc-faint); }
.lc-search kbd { font-size: 10px; padding: 1px 5px; border: 1px solid var(--lc-line); border-radius: 5px; color: var(--lc-faint); }
.lc-search:focus-within kbd, .lc-search input:not(:placeholder-shown) ~ kbd { display: none; }
.lc-tabs { display: flex; gap: 3px; margin: 0 16px 8px; padding: 3px; border-radius: 11px; background: var(--lc-track); }
.lc-tabs button { flex: 1; height: 29px; border: 0; border-radius: 8px; background: transparent; color: var(--lc-muted); font-size: 12px; transition: color .14s, background .14s; }
.lc-tabs button:hover:not(.on) { color: var(--lc-text); }
.lc-tabs button.on { background: var(--lc-raised); color: var(--lc-accent); font-weight: 600; box-shadow: var(--lc-shadow-sm); }
.lc-list { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 10px 10px; }
.lc-list-title { padding: 10px 8px 6px; font-size: 10px; letter-spacing: 1px; color: var(--lc-faint); text-transform: uppercase; }
.lc-row { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 12px; background: transparent; text-align: left; position: relative; transition: background .14s, transform .14s; }
.lc-row:hover { background: color-mix(in srgb, var(--lc-accent) 7%, transparent); }
.lc-row.on { background: var(--lc-raised); box-shadow: var(--lc-shadow-sm); }
.lc-row.on::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: linear-gradient(var(--lc-accent), var(--lc-accent-2)); }
.lc-avatar { position: relative; flex: 0 0 38px; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; color: #fff; font-size: 14px; font-weight: 600; letter-spacing: .5px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25); }
.lc-avatar.sm { flex-basis: 30px; width: 30px; height: 30px; border-radius: 10px; font-size: 12px; }
.lc-avatar.lg { flex-basis: 52px; width: 52px; height: 52px; border-radius: 16px; font-size: 20px; }
.tone-blue { background: linear-gradient(135deg, #4c86ff, #3b6ef6); }
.tone-purple { background: linear-gradient(135deg, #9b7bff, #6d5bff); }
.tone-orange { background: linear-gradient(135deg, #ffb15c, #f4772e); }
.tone-pink { background: linear-gradient(135deg, #ff8fb1, #f2598b); }
.tone-green { background: linear-gradient(135deg, #4fd6a8, #17b981); }
.tone-cyan { background: linear-gradient(135deg, #56c8f5, #2e9bde); }
.tone-me { background: linear-gradient(135deg, #5aa9ff, #8268ff); }
.tone-gray { background: linear-gradient(135deg, #aeb9cb, #8b98ac); }
.lc-avatar .lc-presence { position: absolute; right: -2px; bottom: -2px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--lc-sidebar); background: var(--lc-online); }
.lc-avatar .lc-presence.off { background: #b9c3d2; }
.lc-row-body { flex: 1; min-width: 0; display: grid; gap: 3px; }
.lc-row-top { display: flex; align-items: baseline; gap: 6px; }
.lc-row-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 600; }
.lc-row-time { font-size: 10px; color: var(--lc-faint); flex: 0 0 auto; font-variant-numeric: tabular-nums; }
.lc-row-sub { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--lc-muted); overflow: hidden; white-space: nowrap; }
.lc-row-sub span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.lc-badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(135deg, #ff7a7a, #f2598b); color: #fff; font-size: 10px; font-weight: 700; }
.lc-empty { padding: 38px 14px; text-align: center; color: var(--lc-faint); font-size: 12px; line-height: 1.9; }
/* 会话里一条消息都没有时，把提示放到中间，而不是贴在顶部留一大片空白 */
.lc-messages:not(:has(.lc-msg)) { display: flex; flex-direction: column; justify-content: center; }
.lc-empty strong { display: block; color: var(--lc-muted); font-size: 13px; margin-bottom: 4px; }
/* 列表贴到页脚时用一层渐变收边，避免最后一行被硬切一半 */
.lc-sidebar-foot { position: relative; padding: 10px 14px 14px; border-top: 1px solid var(--lc-line); display: grid; gap: 8px; }
.lc-sidebar-foot::before { content: ""; position: absolute; left: 0; right: 0; top: -18px; height: 18px; pointer-events: none; background: linear-gradient(to top, var(--lc-sidebar), transparent); }
.lc-new-group { display: flex; align-items: center; justify-content: center; gap: 7px; height: 34px; border: 1px solid color-mix(in srgb, var(--lc-accent) 28%, var(--lc-line)); border-radius: 10px; background: color-mix(in srgb, var(--lc-accent) 8%, var(--lc-bg)); color: var(--lc-accent); font-size: 12px; font-weight: 600; transition: background .14s, border-color .14s; }
.lc-new-group:hover { border-color: color-mix(in srgb, var(--lc-accent) 55%, var(--lc-line)); background: color-mix(in srgb, var(--lc-accent) 15%, var(--lc-bg)); }
.lc-me { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border: 0; border-radius: 11px; background: transparent; text-align: left; color: var(--lc-text); }
.lc-me:hover { background: var(--lc-raised); }
.lc-me-text { flex: 1; min-width: 0; display: grid; gap: 2px; }
.lc-me-text strong { font-size: 12px; }
.lc-me-text span { font-size: 10px; color: var(--lc-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lc-me > svg { color: var(--lc-faint); }

/* ---------- 会话头 ---------- */
.lc-chat-head { flex: 0 0 68px; display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid var(--lc-line); background: color-mix(in srgb, var(--lc-bg) 88%, transparent); }
.lc-head-info { flex: 1; min-width: 0; display: grid; gap: 3px; }
.lc-head-info strong { font-size: 15px; }
.lc-head-sub { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--lc-muted); }
.lc-head-sub i { width: 6px; height: 6px; border-radius: 50%; background: var(--lc-online); }
.lc-head-actions { display: flex; gap: 6px; }
.lc-head-btn { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--lc-line); border-radius: 10px; background: var(--lc-field); color: var(--lc-muted); }
.lc-head-btn:hover, .lc-head-btn.on { color: var(--lc-accent); border-color: color-mix(in srgb, var(--lc-accent) 50%, var(--lc-line)); background: var(--lc-accent-soft); }

/* ---------- 消息区 ---------- */
/* overflow-anchor: none — 关掉滚动锚定，否则窗口变窄时浏览器自己改 scrollTop，
   会被「用户滚上去了」误判，贴底逻辑就失效（load more 是手动补位的）。 */
.lc-messages { flex: 1; min-height: 0; overflow-y: auto; overflow-anchor: none; padding: 20px 26px 18px; scroll-behavior: smooth; background-image: radial-gradient(46% 30% at 82% 4%, color-mix(in srgb, var(--lc-accent) 6%, transparent), transparent 75%), radial-gradient(40% 26% at 8% 96%, color-mix(in srgb, var(--lc-accent-2) 5%, transparent), transparent 75%); }
.lc-day { display: flex; justify-content: center; margin: 4px 0 18px; }
.lc-day span, .lc-system span { padding: 4px 11px; border-radius: 10px; background: color-mix(in srgb, var(--lc-faint) 16%, transparent); color: var(--lc-faint); font-size: 10px; }
.lc-system { display: flex; justify-content: center; margin: 12px 0; }
/* 消息节奏：组与组之间 14px，同一个人连续说的几条之间 5px。
   连续消息不重复头像和时间，气泡只往一侧缩进，尾角只画在这一组的最后一条上。 */
.lc-msg { display: flex; align-items: flex-end; gap: 9px; margin-top: 14px; animation: lc-rise .24s ease both; }
.lc-msg.is-cont { margin-top: 5px; }
.lc-day + .lc-msg, .lc-more + .lc-day + .lc-msg { margin-top: 0; }
.lc-msg.is-cont .lc-msg-body { margin-left: 39px; }
.lc-msg.out.is-cont .lc-msg-body { margin-left: 0; margin-right: 39px; }
@keyframes lc-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.lc-msg.out { flex-direction: row-reverse; }
.lc-msg-body { max-width: min(66%, 520px); display: grid; gap: 5px; }
.lc-msg-meta { display: flex; align-items: center; gap: 8px; font-size: 10px; color: var(--lc-faint); padding: 0 3px; font-variant-numeric: tabular-nums; }
.lc-msg.out .lc-msg-meta { justify-content: flex-end; }
.lc-msg-meta strong { color: var(--lc-muted); font-weight: 600; }
.lc-bubble { padding: 10px 14px; border-radius: 16px; background: var(--lc-bubble-in); border: 1px solid var(--lc-line); box-shadow: var(--lc-shadow-sm); font-size: 13px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
.lc-msg.in.is-end .lc-bubble { border-bottom-left-radius: 5px; }
.lc-msg.out .lc-bubble { border-radius: 16px; background: var(--lc-bubble-out); border-color: transparent; color: #fff; box-shadow: 0 8px 20px rgba(76, 110, 246, .28); }
.lc-msg.out.is-end .lc-bubble { border-bottom-right-radius: 5px; }
.lc-bubble .lc-mention { color: var(--lc-accent); font-weight: 600; }
.lc-msg.out .lc-bubble .lc-mention { color: #fff; text-decoration: underline; }
.lc-msg-note { font-size: 10px; color: var(--lc-faint); padding: 0 3px; }

/* ---------- 气泡里的 Markdown ---------- */
.lc-bubble.lc-md { white-space: normal; }
.lc-md p { margin: 0 0 7px; }
.lc-md p:last-child, .lc-md .lc-list:last-child, .lc-md .lc-code:last-child, .lc-md .lc-table:last-child { margin-bottom: 0; }
.lc-md .lc-h { margin: 11px 0 6px; font-weight: 650; line-height: 1.4; }
.lc-md .lc-h:first-child { margin-top: 0; }
.lc-md .lc-h1 { font-size: 16px; }
.lc-md .lc-h2 { font-size: 15px; }
.lc-md .lc-h3 { font-size: 14px; }
.lc-md .lc-h4, .lc-md .lc-h5, .lc-md .lc-h6 { font-size: 13px; color: var(--lc-muted); }
.lc-md .lc-list { margin: 4px 0 8px; padding-left: 19px; }
.lc-md .lc-list li { margin: 2px 0; }

/* ---------- 长会话：载入更早 ---------- */

/* ---------- 输入区 ---------- */

.lc-tools { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }

/* @ 面板：本机模型好友排在真人前面 */

/* ---------- 模型 ⇄ dsh 会话 ---------- */
.lc-session-card .lc-session-id { padding: 7px 9px; border-radius: 9px; background: var(--lc-accent-soft); color: var(--lc-accent);
  font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; letter-spacing: .4px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  font-family: var(--lc-font); font-size: 11px; letter-spacing: 0; }
.lc-session-actions { display: flex; gap: 6px; margin-top: 8px; }
.lc-session-actions button { flex: 1; padding: 6px 8px; border: 1px solid var(--lc-line); border-radius: 9px;
  background: var(--lc-field); color: var(--lc-text); font: inherit; font-size: 11px; cursor: pointer; }
.lc-session-actions button:hover { border-color: var(--lc-accent); color: var(--lc-accent); }

.lc-session-hint { margin: 8px 0 0; font-size: 10px; line-height: 1.6; color: var(--lc-faint); }
.lc-session-pop { position: fixed; left: 50%; top: 84px; transform: translateX(-50%);
  width: min(340px, calc(100vw - 40px)); max-height: 56vh; overflow-y: auto; z-index: 41; }
.lc-pop-title { margin: 0 2px 8px; font-size: 11px; font-weight: 700; color: var(--lc-muted); letter-spacing: .3px; }
.lc-session-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 9px;
  border: 0; border-radius: 10px; background: transparent; color: var(--lc-text); text-align: left; cursor: pointer; }
.lc-session-row:hover { background: var(--lc-accent-soft); }
.lc-session-row-id { font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; color: var(--lc-accent); }
.lc-session-row-meta { margin-left: auto; font-size: 10px; color: var(--lc-faint); }
.lc-session-loading { padding: 10px 4px; font-size: 11px; color: var(--lc-faint); }

/* ---------- 右栏 ---------- */
/* 三张卡共用一套节奏：13px 内边距、14px 圆角、标题 11px、行高 40px 上下。 */
.lc-panel-card { padding: 13px; border: 1px solid var(--lc-line); border-radius: 14px; background: var(--lc-raised); box-shadow: var(--lc-shadow-sm); margin-bottom: 10px; }

.lc-panel-title span { font-weight: 500; color: var(--lc-faint); letter-spacing: 0; }
.lc-profile { display: grid; justify-items: center; text-align: center; gap: 7px; padding-bottom: 4px; }
.lc-profile strong { font-size: 14px; }

.lc-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 7px; background: var(--lc-accent-soft); color: var(--lc-accent); font-size: 10px; }
.lc-notice { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 6px; padding: 9px 11px; border-radius: 11px; background: linear-gradient(135deg, color-mix(in srgb, var(--lc-accent) 12%, var(--lc-bg)), color-mix(in srgb, var(--lc-accent-2) 12%, var(--lc-bg))); font-size: 11px; line-height: 1.7; color: var(--lc-muted); }
.lc-notice strong { display: block; color: var(--lc-text); font-size: 11px; margin-bottom: 3px; }
/* 成员不单独滚动：整栏一起滚，最后一行不会被卡片边缘切掉 */
.lc-member { display: flex; align-items: center; gap: 9px; padding: 5px 0; }
.lc-member-body { flex: 1; min-width: 0; display: grid; gap: 2px; }
.lc-member-body strong { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lc-member-body span { font-size: 10px; color: var(--lc-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lc-member-state { flex: 0 0 auto; font-size: 10px; color: var(--lc-faint); }
.lc-member-state.on { color: var(--lc-online); }
.lc-group-label { margin: 8px 0 2px; font-size: 10px; color: var(--lc-faint); }
.lc-radar { position: relative; height: 78px; border-radius: 11px; overflow: hidden; background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--lc-accent) 12%, var(--lc-bg)), transparent 72%), var(--lc-chat); border: 1px solid var(--lc-line); margin-bottom: 6px; }
.lc-radar::before, .lc-radar::after { content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border: 1px solid color-mix(in srgb, var(--lc-accent) 26%, transparent); border-radius: 50%; }
.lc-radar::before { width: 46px; height: 46px; }
.lc-radar::after { width: 92px; height: 92px; }
.lc-radar-sweep { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; border-radius: 50%; background: conic-gradient(from 0deg, color-mix(in srgb, var(--lc-accent) 34%, transparent), transparent 62%); transform-origin: 0 0; animation: lc-sweep 3.4s linear infinite; }
@keyframes lc-sweep { to { transform: rotate(360deg); } }
.lc-radar-dot { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--lc-online); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lc-online) 25%, transparent); }
.lc-radar-dot.d1 { left: 29%; top: 38%; } .lc-radar-dot.d2 { left: 67%; top: 30%; } .lc-radar-dot.d3 { left: 60%; top: 68%; }
.lc-device { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--lc-line); }
.lc-device:last-child { border-bottom: 0; padding-bottom: 2px; }
.lc-device i { width: 7px; height: 7px; border-radius: 50%; background: var(--lc-online); flex: 0 0 7px; }
.lc-device i.off { background: #b9c3d2; }
.lc-device-body { flex: 1; min-width: 0; display: grid; gap: 1px; }
.lc-device-body strong { font-size: 11px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lc-device-body span { font-size: 10px; color: var(--lc-faint); font-variant-numeric: tabular-nums; }
.lc-device-version { flex: 0 0 auto; font-size: 9px; color: var(--lc-muted); background: color-mix(in srgb, var(--lc-faint) 12%, transparent); padding: 2px 6px; border-radius: 6px; white-space: nowrap; }
/* 局域网发现健康：UDP 状态、最近收到广播时间和防火墙排查提示 */
.lc-net-health {
  margin: -2px 0 10px; padding: 9px 11px; border: 1px solid var(--lc-line); border-radius: 12px;
  background: color-mix(in srgb, var(--lc-online) 6%, var(--lc-raised));
}
.lc-net-health.is-warn { border-color: color-mix(in srgb, #d9a441 45%, var(--lc-line)); background: color-mix(in srgb, #d9a441 10%, var(--lc-raised)); }

.lc-group-settings > div { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; }
.lc-group-settings > div strong { font-weight: 600; }
.lc-group-settings > div span { color: var(--lc-muted); text-align: right; }
.lc-group-settings .lc-btn { justify-self: start; margin-top: 2px; }
.lc-setting-check { display: flex; align-items: flex-start; gap: 9px; margin-top: 14px; padding: 10px; border: 1px solid var(--lc-line); border-radius: 10px; background: var(--lc-chat); cursor: pointer; }
.lc-setting-check input { flex: none; margin: 2px 0 0; accent-color: var(--lc-accent); }
.lc-setting-check span { display: grid; gap: 4px; }
.lc-setting-check strong { font-size: 11px; font-weight: 600; }
.lc-setting-check small { color: var(--lc-muted); font-size: 10px; line-height: 1.5; }
.lc-group-invited { display: flex; align-items: center; gap: 8px; min-height: 32px; font-size: 12px; }
.lc-group-invited small { margin-left: auto; color: var(--lc-muted); font-size: 10px; }

/* ---------- 模态 / toast ---------- */
.lc-modal-root { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 20px; background: rgba(9, 18, 34, .46); backdrop-filter: blur(5px); }
.lc-modal-root[hidden], .lc-pop[hidden], .lc-toast[hidden] { display: none; }
.lc-modal { width: min(390px, 100%); padding: 20px; border-radius: 18px; background: var(--lc-raised); color: var(--lc-text); border: 1px solid var(--lc-line); box-shadow: 0 28px 70px rgba(10, 22, 44, .32); animation: lc-rise .18s ease both; }
.lc-modal h3 { margin: 0 0 4px; font-size: 16px; }
.lc-modal p { margin: 0 0 16px; font-size: 11px; color: var(--lc-muted); line-height: 1.6; }
.lc-field { width: 100%; height: 38px; padding: 0 12px; border: 1px solid var(--lc-line); border-radius: 10px; background: var(--lc-chat); color: var(--lc-text); font-size: 13px; outline: 0; }
.lc-field:focus { border-color: var(--lc-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lc-accent) 12%, transparent); }
.lc-modal-label { display: block; margin: 14px 0 8px; font-size: 11px; color: var(--lc-muted); }
.lc-check-list { max-height: 190px; overflow-y: auto; display: grid; gap: 2px; }
.lc-check { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border: 0; border-radius: 10px; background: transparent; color: var(--lc-text); text-align: left; width: 100%; }
.lc-check:hover { background: var(--lc-accent-soft); }
.lc-check-box { width: 17px; height: 17px; flex: 0 0 17px; display: grid; place-items: center; border: 1.5px solid var(--lc-line); border-radius: 5px; color: #fff; font-size: 11px; }
.lc-check.on .lc-check-box { background: var(--lc-accent); border-color: var(--lc-accent); }
.lc-check-body { flex: 1; min-width: 0; display: grid; gap: 2px; }
.lc-check-body strong { font-size: 12px; }
.lc-check-body span { font-size: 10px; color: var(--lc-faint); }
.lc-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.lc-btn { height: 34px; padding: 0 16px; border: 1px solid var(--lc-line); border-radius: 10px; background: var(--lc-field); color: var(--lc-text); font-size: 12px; }
.lc-btn:hover { border-color: var(--lc-accent); color: var(--lc-accent); }
.lc-btn.primary { border: 0; background: linear-gradient(135deg, var(--lc-accent), var(--lc-accent-2)); color: var(--dsw-alias-label-primary-foreground, #fff); font-weight: 600; box-shadow: 0 6px 16px color-mix(in srgb, var(--lc-accent) 28%, transparent); }
.lc-btn.primary:hover { filter: brightness(1.06); color: #fff; }
.lc-toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 60; padding: 9px 16px; border-radius: 11px; background: rgba(23, 35, 60, .92); color: #fff; font-size: 12px; box-shadow: 0 12px 30px rgba(0, 0, 0, .28); animation: lc-rise .18s ease both; }

/* ---------- 焦点与降级 ---------- */
/* 键盘走到哪里都看得见；鼠标点击不画圈（Chrome 的 :focus-visible 已经这样分）。 */
.lc-app button:focus-visible, .lc-titlebar button:focus-visible, .lc-modal-root button:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--lc-accent) 72%, transparent); outline-offset: 2px;
}
.lc-search input:focus-visible, .lc-input-row textarea:focus-visible, .lc-field:focus-visible { outline: 0; }
.lc-app button::-moz-focus-inner { border: 0; }

@media (prefers-reduced-motion: reduce) {
  .lc-messages { scroll-behavior: auto; }
  .lc-msg, .lc-pop, .lc-modal, .lc-toast { animation: none; }
  .lc-pulse, .lc-radar-sweep { animation: none; }
  .lc-row, .lc-search, .lc-input-row, .lc-send { transition: none; }
}

/* ---------- 响应式 ---------- */
@media (max-width: 1080px) {
  .lc-app, body.lc-detail-hidden .lc-app { grid-template-columns: 252px minmax(0, 1fr); }
  .lc-detail { display: none; }
}
@media (max-width: 720px) {
  .lc-app, body.lc-detail-hidden .lc-app { grid-template-columns: 1fr; }
  .lc-sidebar { display: none; }
  .lc-window { width: 100vw; height: 100vh; border-radius: 0; }
  .lc-messages { padding: 16px 14px; }
  .lc-msg-body { max-width: 82%; }
}

  function createDemoBackend() {
    var state = demoState(), listeners = new Set(), replyTimers = []
    function emit() { for (var fn of listeners) fn(state) }
    function push(convId, message) {
      if (!state.messages[convId]) state.messages[convId] = []
      state.messages[convId].push(message)
      var conv = state.conversations.find(function (c) { return c.id === convId })
      if (conv) conv.updatedAt = message.at
    }
    var REPLIES = [
      '收到 👌 我看一下就回你',
      '这个想法不错，就这么定吧 ✨',
      '哈哈，正好我也在弄这块',
      '好，我在 192.168.1.x 这个网段，随时喊我',
      '稍等，我这边窗口开着，马上试一下',
      '👍 已经同步给大家了'
    ]
    // 原型里模型好友的回复故意用 Markdown，方便直接看渲染效果
    var BOT_REPLY_MD = [
      '**三条要点**',
      '',
      '1. 左栏保留「消息 / 通讯录 / 群聊」三个 Tab，路径最短',
      '2. 右栏发现设备用雷达动画，一眼能看出谁在线',
      '3. 私聊可以开成独立小窗，叠在主窗口上',
      '',
      '> 交互稿第 3 页还有个待确认点：群公告要不要支持 Markdown？',
      '',
      '```js',
      "const sum = list => list.reduce((a, b) => a + b, 0)",
      '```',
      '',
      '细节见 [设计稿](https://example.com/design)，`Enter` 发送、`Shift+Enter` 换行。'
    ].join('\n')
    return {
      start: function () { emit() },
      subscribe: function (fn) { listeners.add(fn); return function () { listeners.delete(fn) } },
      send: function (convId, text) {
        var conv = state.conversations.find(function (c) { return c.id === convId })
        if (!conv) return Promise.resolve()
        push(convId, { id: 'm' + Date.now() + Math.random(), conversationId: convId, from: state.me.id,
          fromName: state.me.nickname, text: text, at: Date.now(), kind: 'text' })
        // 原型里 @ 到模型好友就模拟一条回复，让 demo 与 live 的交互一致
        var bots = mentionedBots(text, state.bots).filter(function (bot) {
          return conv.kind !== 'group' || (conv.memberIds || []).indexOf(bot.id) >= 0
        })
        var direct = conv.kind === 'direct' ? (state.bots || []).find(function (b) { return b.id === conv.peerId }) : null
        if (!bots.length && direct) bots.push(direct)   // 显式 @ 了别人时，私聊对象不跟着回答
        bots = bots.slice(0, 4)
        if (bots.length) {
          state.pending[convId] = bots.map(function (b) { return b.name })
          emit()
          var botTimer = setTimeout(function () {
            for (var b of bots) {
              push(convId, { id: 'r' + Date.now() + Math.random(), conversationId: convId, from: b.id,
                fromName: b.name, text: BOT_REPLY_MD, at: Date.now(), kind: 'text' })
            }
            delete state.pending[convId]
            emit()
          }, 1600)
          replyTimers.push(botTimer)
          return Promise.resolve()
        }
        emit()
        var pool = conv.kind === 'group' ? state.peers.filter(function (p) { return p.online }) : state.peers.filter(function (p) { return p.id === conv.peerId })
        var peer = pool[Math.floor(Math.random() * pool.length)]
        if (!peer) return Promise.resolve()
        ui.typing = convId
        paintTyping()
        var timer = setTimeout(function () {
          push(convId, { id: 'r' + Date.now() + Math.random(), conversationId: convId, from: peer.id,
            fromName: peer.name, text: REPLIES[Math.floor(Math.random() * REPLIES.length)], at: Date.now(), kind: 'text' })
          ui.typing = ''
          paintTyping()
          emit()
        }, 1600)
        replyTimers.push(timer)
        return Promise.resolve()
      },
      createConversation: function (options) {
        var now = Date.now()
        if (options.kind === 'direct') {
          var existing = state.conversations.find(function (c) { return c.peerId === options.peerId })
          if (existing) return Promise.resolve(existing.id)
          var peer = state.peers.find(function (p) { return p.id === options.peerId }) ||
            state.bots.find(function (b) { return b.id === options.peerId }) || { name: '新成员', id: options.peerId }
          var id = 'd-' + options.peerId
          var direct = { id: id, kind: 'direct', peerId: options.peerId, name: peer.name,
            icon: peer.bot ? '🤖' : peer.name.slice(0, 1), tone: toneOf(peer.id),
            memberIds: [state.me.id, peer.id], unread: 0, updatedAt: now }
          if (peer.bot) direct.bot = true
          state.conversations.unshift(direct)
          state.messages[id] = [{ id: 'sys' + now, conversationId: id, from: '', fromName: '',
            text: peer.bot ? '已连接本机模型「' + peer.name + '」，直接发消息或 @ 它就能让它干活' : '已连接，可以开始私聊了',
            at: now, kind: 'system' }]
        } else {
          var gid = 'g-' + now.toString(36)
          var invitedBots = (state.bots || []).filter(function (bot) { return (options.botIds || []).indexOf(bot.id) >= 0 })
          state.conversations.unshift({ id: gid, kind: 'group', name: options.name, icon: '💬', tone: toneOf(gid),
            memberIds: [state.me.id].concat(options.memberIds || [], invitedBots.map(function (bot) { return bot.id })),
            botMembers: invitedBots.map(function (bot) { return Object.assign({}, bot, { ownerId: state.me.id }) }),
            allowOthersMention: options.allowOthersMention === true, notice: '欢迎加入新群聊 🎉', unread: 0, updatedAt: now })
          state.messages[gid] = [{ id: 'sys' + now, conversationId: gid, from: '', fromName: '', text: '你创建了群聊「' + options.name + '」', at: now, kind: 'system' }]
          emit()
          return Promise.resolve(gid)
        }
        emit()
        return Promise.resolve(options.kind === 'direct' ? 'd-' + options.peerId : '')
      },
      updateGroup: function (options) {
        var conv = state.conversations.find(function (row) { return row.id === options.conversationId })
        if (conv && conv.kind === 'group') {
          var added = (state.bots || []).filter(function (bot) { return (options.botIds || []).indexOf(bot.id) >= 0 })
          conv.botMembers = conv.botMembers || []
          added.forEach(function (bot) {
            if (!conv.botMembers.some(function (item) { return item.id === bot.id })) {
              conv.botMembers.push(Object.assign({}, bot, { ownerId: state.me.id }))
              conv.memberIds.push(bot.id)
            }
          })
          conv.allowOthersMention = options.allowOthersMention === true
          emit()
        }
        return Promise.resolve()
      },
      markRead: function (convId) {
        var conv = state.conversations.find(function (c) { return c.id === convId })
        if (conv && conv.unread) { conv.unread = 0; emit() }
        return Promise.resolve()
      },
      setProfile: function (nickname) { state.me.nickname = nickname; state.me.name = nickname; emit(); return Promise.resolve() },
      refresh: function () { emit(); return Promise.resolve() },
      // 原型里没有真宿主：只是让「绑定 / 新建会话」两个按钮点得动
      botSessions: function () {
        return Promise.resolve({ available: false, items: [
          { id: 'sess-demo-0001', updatedAt: Date.now() - 3600_000, blank: false },
          { id: 'sess-demo-0002', updatedAt: Date.now() - 7200_000, blank: true },
        ] })
      },
      bindBot: function (botId, sessionId) {
        var bot = state.bots.find(function (b) { return b.id === botId })
        if (bot) bot.sessionId = sessionId || ''
        emit()
        return Promise.resolve({ ok: true, sessionId: sessionId })
      },
      newBotSession: function (botId) {
        var bot = state.bots.find(function (b) { return b.id === botId })
        var id = 'sess-demo-' + Math.random().toString(36).slice(2, 8)
        if (bot) bot.sessionId = id
        emit()
        return Promise.resolve({ ok: true, sessionId: id })
      },
      dispose: function () { for (var t of replyTimers) clearTimeout(t) }
    }
  }

  /* ------------------------------ live 后端 ------------------------------ */
  function createLiveBackend() {
    var state = { me: { nickname: '我' }, peers: [], bots: [], pending: {}, retrying: {}, conversations: [], messages: {} },
      listeners = new Set(), source = null
    function emit() { for (var fn of listeners) fn(state) }
    function adopt(data) {
      if (!data) return
      state = data
      state.bots = state.bots || []       // 旧版服务没有模型好友字段时也能正常渲染
      state.pending = state.pending || {}
      state.retrying = state.retrying || {}
      emit()
    }
    function post(path, payload) {
      return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload || {}) })
        .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json() })
    }
    return {
      start: function () {
        return fetch('/api/state').then(function (res) { return res.json() }).then(function (data) {
          adopt(data)
          source = new EventSource('/api/events')
          source.onmessage = function (event) {
            try {
              var packet = JSON.parse(event.data)
              if (packet.type === 'state') adopt(packet.state)
            } catch (e) {}
          }
        }).catch(function (error) { toast('连接本机聊天服务失败：' + error.message) })
      },
      subscribe: function (fn) { listeners.add(fn); return function () { listeners.delete(fn) } },
      send: function (convId, text) { return post('/api/send', { conversationId: convId, text: text }).then(function (data) { adopt(data.state) }) },
      createConversation: function (options) { return post('/api/conversations', options).then(function (data) { adopt(data.state); return data.id }) },
      updateGroup: function (options) { return post('/api/group/settings', options).then(function (data) { adopt(data.state); return data }) },
      markRead: function (convId) { return post('/api/read', { conversationId: convId }).then(function (data) { adopt(data.state) }) },
      setProfile: function (nickname) { return post('/api/profile', { nickname: nickname }).then(function (data) { adopt(data.state) }) },
      refresh: function () { return fetch('/api/state').then(function (res) { return res.json() }).then(adopt) },
      botSessions: function () {
        return fetch('/api/bots/sessions').then(function (res) { return res.json() })
      },
      bindBot: function (botId, sessionId) {
        return post('/api/bind', { botId: botId, sessionId: sessionId }).then(function (data) { adopt(data.state); return data })
      },
      newBotSession: function (botId, conversationId) {
        return post('/api/context/reset', { botId: botId, conversationId: conversationId })
          .then(function (data) { adopt(data.state); return data })
      },
      dispose: function () { if (source) source.close() }
    }
  }

    'label-tertiary', 'border-l1', 'border-l2', 'border-l3', 'interactive-bg-hover', 'interactive-bg-active',
    'state-business-primary']
  window.addEventListener('message', function (event) {
    if (event.source !== window.parent || !event.data || event.data.type !== 'world-dsh-theme') return
    document.documentElement.setAttribute('data-theme', event.data.theme === 'dark' ? 'dark' : 'light')
    var colors = event.data.colors && typeof event.data.colors === 'object' ? event.data.colors : {}
    THEME_TOKENS.forEach(function (token) {
      var value = colors[token]
      if (typeof value === 'string' && value.length <= 80 && window.CSS && CSS.supports('color', value)) {
        document.documentElement.style.setProperty('--dsw-alias-' + token, value)
      }
    })
    var mapped = {
      '--lc-bg': colors['bg-base'], '--lc-sidebar': colors['bg-layer-1'], '--lc-chat': colors['bg-layer-1'],

  function peerById(id) {
    return (S.peers || []).find(function (p) { return p.id === id }) ||
      (S.bots || []).find(function (b) { return b.id === id })
  }
  function convById(id) { return (S.conversations || []).find(function (c) { return c.id === id }) }
  function activeConv() {
    if (ui.activeId && convById(ui.activeId)) return convById(ui.activeId)
    var list = (S.conversations || []).slice().sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0) })
    return list[0] || null
  }
  function convName(conv) {
    if (!conv) return ''
    if (conv.kind === 'direct') { var p = peerById(conv.peerId); return p ? p.name : conv.name }
    return conv.name
  }
  function convIcon(conv) {
    if (!conv) return '💬'
    if (conv.kind === 'group') return conv.icon || '👥'
    var p = peerById(conv.peerId)
    return p ? p.name.slice(0, 1) : (conv.icon || '?')

    var list = (S.messages && S.messages[conv.id]) || []

      tab.setAttribute('aria-selected', tab.dataset.tab === ui.tab ? 'true' : 'false')
    }

        : (p ? (p.online ? '在线' : '离线') + ' · ' + p.ip + ' · ' + p.machine : '私聊'))

  // 长会话裁剪：默认只渲染最近 MESSAGE_WINDOW 条，点「载入更早」再往前翻
  var lastMessagesKey = ''

  function renderMessages(options) {
    var box = $('lcMessages'), conv = activeConv()
    if (!conv) {
      lastMessagesKey = ''
      box.innerHTML = '<div class="lc-empty"><strong>开始一段聊天</strong>左侧「通讯录」里点一个人，就能直接私聊</div>'
      return
    }
    var list = (S.messages && S.messages[conv.id]) || []
    var key = [conv.id, list.length, list.length ? list[list.length - 1].id : '', ui.show, S.me.id, S.me.nickname].join('|')
    // 只有「消息集合 / 窗口大小 / 我」变化时才重建，纯在线状态推送不碰 DOM
    if (key === lastMessagesKey && !(options && options.force)) return
    lastMessagesKey = key

    var stick = box.scrollHeight - box.scrollTop - box.clientHeight < 140
    var top = box.scrollTop
    var start = Math.max(0, list.length - ui.show)
    var html = ''
    if (start > 0) {
      html += '<div class="lc-more"><button type="button" data-action="more">载入更早的 ' +
        Math.min(MESSAGE_WINDOW, start) + ' 条</button><span>共 ' + list.length + ' 条</span></div>'
    }
    html += '<div class="lc-day"><span>今天</span></div>'
    if (!list.length) html += '<div class="lc-empty"><strong>还没有消息</strong>发一句「在吗」打个招呼吧 👋</div>'
    // 同一个人 5 分钟内连续说的几条合成一组：只留第一个头像、第一个时间，
    // 气泡之间收紧到 5px，尾角只画在最后一条上——一屏能多看清一两条消息。
    var GROUP_GAP = 5 * 60000
    var plain = list.filter(function (m) { return m.kind !== 'system' })
    var groupOf = {}
    for (var g = 0; g < plain.length; g += 1) {
      var prevPlain = plain[g - 1], nextPlain = plain[g + 1]
      groupOf[plain[g].id] = {
        cont: Boolean(prevPlain && prevPlain.from === plain[g].from && plain[g].at - prevPlain.at < GROUP_GAP && plain[g].at >= prevPlain.at),
        end: !(nextPlain && nextPlain.from === plain[g].from && nextPlain.at - plain[g].at < GROUP_GAP && nextPlain.at >= plain[g].at),
      }
    }
    for (var index = start; index < list.length; index += 1) {
      var message = list[index]
      if (message.kind === 'system') { html += '<div class="lc-system"><span>' + esc(message.text) + '</span></div>'; continue }
      var mine = message.from === S.me.id
      var sender = mine ? S.me.nickname : message.fromName
      var group = groupOf[message.id] || { cont: false, end: true }
      html += '<div class="lc-msg ' + (mine ? 'out' : 'in') + (group.cont ? ' is-cont' : ' is-start') + (group.end ? ' is-end' : '') + '">' +
        (group.cont ? '' : avatarHtml(mine ? S.me.nickname.slice(0, 1) : String(sender || '?').slice(0, 1), mine ? 'me' : toneOf(message.from), 'sm')) +
        '<div class="lc-msg-body">' +
        (group.cont ? '' : '<div class="lc-msg-meta">' +
          (conv.kind === 'group' && !mine ? '<strong>' + esc(sender) + '</strong>' : '') +
          '<span>' + esc(clock(message.at)) + '</span></div>') +
        '<div class="lc-bubble lc-md">' + markdownHtml(message.id, message.text) + '</div></div></div>'
    }
    box.innerHTML = html
    if (stick) { box.scrollTop = box.scrollHeight; pinnedToBottom = true }
    else if (options && options.fromBottom) {
      // 往前翻历史时按「距底部的距离」定位，并临时关掉平滑滚动，避免整屏滑动
      var previous = box.style.scrollBehavior
      box.style.scrollBehavior = 'auto'
      box.scrollTop = Math.max(0, box.scrollHeight - options.fromBottom)
      box.style.scrollBehavior = previous
    } else box.scrollTop = top
  }

  function shortSessionId(id) { return String(id || '').slice(0, 8) }

  /**
   * 模型私聊里的「dsh 会话」卡片。
   * 模型上下文在 dsh 会话里（由 dsh 负责压缩 / 持久化），聊天记录在本机另存一份，
   * 所以既能换会话从头开始，又不会把聊天记录弄丢。
   */
  function sessionCardHtml(bot) {
    var sessionId = bot.sessionId || ''
    return '<div class="lc-panel-card lc-session-card">' +
      '<div class="lc-panel-title">dsh 会话 <span>' + (sessionId ? '已绑定' : '未绑定') + '</span></div>' +
      '<div class="lc-session-id' + (sessionId ? '' : ' empty') + '" title="' + esc(sessionId) + '">' +
      (sessionId ? esc(shortSessionId(sessionId)) : '第一次派活时自动新建一个') + '</div>' +
      '<div class="lc-session-actions">' +
      '<button type="button" data-action="bot-session-new" data-bot="' + esc(bot.id) + '">新建会话</button>' +
      '<button type="button" data-action="bot-session-pick" data-bot="' + esc(bot.id) + '">绑定已有</button>' +
      (sessionId ? '<button type="button" class="lc-session-clear" data-action="bot-session-clear" data-bot="' + esc(bot.id) + '">解绑</button>' : '') +
      '</div>' +
      '<p class="lc-session-hint">模型看到的是 dsh 会话里的上下文；这里的聊天记录另外存在本机，重启 dsh 后都还在。</p></div>'
  }

  function renderDetail() {
    var detail = $('lcDetail'), conv = activeConv()
    if (!conv) { detail.innerHTML = ''; return }
    var botId = conv.ownerBotId || (conv.kind === 'direct' && String(conv.peerId || '').indexOf('bot:') === 0 ? conv.peerId : '')
    var bot = botId ? (S.bots || []).find(function (b) { return b.id === botId }) : null
    var members = (conv.memberIds || []).map(function (id) {
      if (id === S.me.id) return { id: id, name: S.me.nickname, machine: S.me.machine, ip: S.me.ip, online: true, me: true, world: S.me.world }
      var p = peerById(id)
      var invited = (conv.botMembers || []).find(function (item) { return item.id === id })
      if (!p && invited) p = invited
      var botOwner = invited && invited.ownerId === S.me.id
        ? null : invited && (S.peers || []).find(function (peer) { return peer.id === invited.ownerId })
      return p ? Object.assign({}, p, { me: false,
        machine: p.bot ? (invited && invited.ownerId === S.me.id ? '本机模型' : '模型好友') : p.machine,
        ip: p.bot ? p.provider + '/' + p.model : p.ip,
        online: p.bot ? (invited ? invited.ownerId === S.me.id || Boolean(botOwner && botOwner.online) : p.online) : p.online }) : null
    }).filter(Boolean)
    var online = members.filter(function (m) { return m.online }), offline = members.filter(function (m) { return !m.online })
    var html = '<div class="lc-panel-card"><div class="lc-profile">' +
      avatarHtml(convIcon(conv), conv.tone, 'lg') + '<strong>' + esc(convName(conv)) + '</strong>' +
      '<span>' + (conv.kind === 'group' ? '群聊 · ' + members.length + ' 位成员'
        : (conv.bot ? '私聊 · 本机模型' : '私聊 · ' + (members[1] ? esc(members[1].ip) : ''))) + '</span>' +
      '<span class="lc-chip"><span class="lc-pulse"></span>' + (conv.kind === 'group' ? online.length + ' 人在线' : '局域网直连') + '</span></div>' +
      (conv.notice ? '<div class="lc-notice"><strong>群公告</strong>' + esc(conv.notice) + '</div>' : '') + '</div>'
    if (bot) html += sessionCardHtml(bot)

    var membersHtml = '<div class="lc-panel-card lc-members-card"><div class="lc-panel-title">成员 <span>' + online.length + ' 在线 / ' + members.length + '</span></div>'
    var twoGroups = Boolean(online.length && offline.length)
    for (var group of [['在线', online], ['离线', offline]]) {
      if (!group[1].length) continue
      // 只有一组时不重复写「在线」：标题里已经说了
      if (twoGroups) membersHtml += '<div class="lc-group-label">' + group[0] + '</div>'
      membersHtml += group[1].map(function (m) {
        return '<div class="lc-member">' + avatarHtml(m.name.slice(0, 1), m.me ? 'me' : toneOf(m.id), 'sm', m.online) +
          '<div class="lc-member-body"><strong>' + esc(m.name) + (m.me ? ' · 我' : '') + '</strong><span>' + esc(m.machine) + ' · ' + esc(m.ip) + '</span></div>' +
          '<span class="lc-member-state' + (m.online ? ' on' : '') + '">' + (m.bot ? '模型' : (m.online ? '在线' : '离线')) + '</span></div>'
      }).join('')
    }
    if (conv.kind === 'group') {
      membersHtml += '<div class="lc-group-settings"><div><strong>群内模型</strong><span>' +
        ((conv.botMembers || []).length ? (conv.botMembers || []).length + ' 个已邀请' : '默认不加入模型好友') +
        '</span></div><div><strong>其他成员 @ 模型</strong><span>' + (conv.allowOthersMention ? '允许' : '关闭') +
        '</span></div>' + (conv.id !== 'g-lan-lobby' && (!conv.ownerId || conv.ownerId === S.me.id)
          ? '<button type="button" class="lc-btn" data-action="group-settings">管理模型与 @ 权限</button>' : '') + '</div>'
    }
    membersHtml += '</div>'

    var devices = [{ name: S.me.nickname + '（本机）', ip: S.me.ip, world: S.me.world, online: true, me: true }].concat(
      (S.peers || []).map(function (p) { return { name: p.name, ip: p.ip, world: p.world, online: p.online } }))
      .filter(function (d) { return d.online })
    // 雷达上的点跟着在线台数走，别固定画三个
    var radarDots = devices.slice(0, 3).map(function (_, i) {
      return '<i class="lc-radar-dot d' + (i + 1) + '"></i>'
    }).join('')
    var discoverHtml = '<div class="lc-panel-card"><div class="lc-panel-title">局域网发现 <span>' + devices.length + ' 台在线</span></div>' +
      '<div class="lc-radar"><div class="lc-radar-sweep"></div>' + radarDots + '</div>' +
      devices.map(function (d) {
        return '<div class="lc-device"><i class="' + (d.online ? '' : 'off') + '"></i><div class="lc-device-body"><strong>' + esc(d.name) + '</strong>' +
          '<span>' + esc(d.ip) + '</span></div><span class="lc-device-version">' + esc(String(d.world || '').replace('@local/dsh-world ', 'world ')) + '</span></div>'
      }).join('') + '</div>'
    var safeHtml = '<div class="lc-safe-note"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="flex:0 0 13px;margin-top:1px"><path d="M12 3l8 3v6c0 5-3.4 8-8 9-4.6-1-8-4-8-9V6l8-3z"/></svg>' +
      '<span>自动发现同一网段中装有 world 插件的设备；消息点对点传输，不经过任何外部服务器。</span></div>'
    // 网络健康：UDP 收不到时，先看这里，不用再猜「为什么对方看不到我」
    var net = S.network || {}
    var inboundAgo = net.lastInboundAt ? Math.max(0, Math.round((Date.now() - net.lastInboundAt) / 1000)) : null
    var netWarn = net.warnings && net.warnings.length ? net.warnings[0] : ''
    var netHtml = '<div class="lc-net-health' + (netWarn ? ' is-warn' : '') + '">' +
      '<div class="lc-net-line"><i></i><span>UDP ' + esc(String(net.discoveryPort || 53318)) +
        (net.udpBound ? ' 已就绪' : ' 未绑定') + ' · ' +
        (inboundAgo === null ? '尚未收到广播' : '收到广播 ' + inboundAgo + ' 秒前') +
        (net.onlinePeers === undefined ? '' : ' · ' + net.onlinePeers + ' 台在线') + '</span>' +
      '<button type="button" class="lc-net-copy" data-action="copy-diagnostics">复制诊断</button></div>' +
      (netWarn ? '<div class="lc-net-warn">' + esc(netWarn) + '</div>' : '') + '</div>'
    // 发现卡排在成员卡前面：局域网状态是这个应用最需要一眼看到的信息
    detail.innerHTML = html + discoverHtml + netHtml + membersHtml + safeHtml
  }

  function paintTyping() {
    var id = ui.activeId
    var retry = (S && S.retrying && id && S.retrying[id]) || []
    var names = (S && S.pending && id && S.pending[id]) || []
    var text = ''
    if (retry.length) {
      text = '🤖 ' + retry.map(function (r) { return r.name + ' 重试 ' + r.attempt + '/' + r.attempts }).join('、') + '…'
    } else if (names.length) {
      text = '🤖 ' + names.join('、') + ' 正在思考…'
    } else if (ui.typing) {
      text = '对方正在输入…'
    }
    $('lcTyping').textContent = text
  }

  function render() {
    if (!S) return
    $('lcOnlineCount').textContent = onlineCount() + ' 人在线'
    $('lcMyName').textContent = S.me.nickname || '我'
    $('lcMyStatus').textContent = '在线 · ' + (S.me.ip || '本机')
    $('lcMeAvatar').textContent = (S.me.nickname || '我').slice(0, 1)
    if (!ui.activeId && activeConv()) ui.activeId = activeConv().id
    var active = activeConv()
    if (active && active.unread && ui.lastReadId !== active.id) {
      ui.lastReadId = active.id
      Promise.resolve(backend.markRead(active.id)).catch(function () {})
    }
    renderSidebar(); renderHead(); renderMessages(); renderDetail(); paintTyping()
    document.body.classList.toggle('lc-detail-hidden', ui.detailHidden)
    syncSend()
  }

  /** 发送按钮只有「有会话 + 输入框里有字」才亮起来。 */
  function syncSend() {
    $('lcSend').disabled = !activeConv() || !$('lcInput').value.trim()
  }

  backend.subscribe(function (next) { S = next; render() })

  /* ------------------------------ 交互 ------------------------------ */
  function toast(message) {
    var el = $('lcToast'); el.textContent = message; el.hidden = false
    clearTimeout(toast.timer); toast.timer = setTimeout(function () { el.hidden = true }, 2200)
  }

  /** 把 /api/diagnostics 的完整结果复制给用户；排查时直接贴给另一边或贴到工单里。 */
  function copyDiagnostics() {
    if (DEMO) { toast('演示模式没有本机诊断'); return }
    fetch('/api/diagnostics').then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status)
      return res.json()
    }).then(function (data) {
      var text = JSON.stringify(data, null, 2)
      if (!navigator.clipboard || !navigator.clipboard.writeText) { toast('当前环境不支持复制'); return }
      navigator.clipboard.writeText(text).then(function () { toast('诊断信息已复制') }, function () { toast('复制失败') })
    }).catch(function (error) { toast('读取诊断失败：' + error.message) })
  }
  var lcTools = document.querySelector('.lc-tools')
  function closePop() {
    ui.pop = ''; $('lcEmojiPop').hidden = true; $('lcQuickPop').hidden = true; $('lcMentionPop').hidden = true
    for (var b of lcTools.querySelectorAll('button')) b.classList.remove('on')
  }
  /** @ 面板：本机模型好友排在真人前面，点一下把「@名字 」插进输入框。 */
  function mentionHtml() {
    var conv = activeConv()
    var invited = conv && conv.kind === 'group' ? (conv.botMembers || []) : (S.bots || [])
    var bots = invited.map(function (member) {
      return (S.bots || []).find(function (bot) { return bot.id === member.id }) || member
    }).filter(function (b) { return matches(b.name) || matches(b.model) || matches(b.provider) })
    var people = []
    if (conv) {
      var ids = conv.kind === 'group' ? (conv.memberIds || []).filter(function (id) { return String(id).indexOf('bot:') !== 0 }) : [conv.peerId]
      people = ids.map(peerById).filter(function (p) { return p && p.id !== S.me.id && !p.bot })
    }
    var rows = bots.map(function (b) {
      var member = invited.find(function (item) { return item.id === b.id })
      return { name: b.name, sub: (member && member.ownerId === S.me.id ? '本机模型 · ' : '模型好友 · ') + b.provider + '/' + b.model, bot: true }
    }).concat(people.map(function (p) {
      return { name: p.name, sub: p.machine + ' · ' + p.ip, bot: false }
    }))
    if (!rows.length) return '<div class="lc-mention-empty">还没有可 @ 的成员</div>'
    return '<div class="lc-mention-title">点一下插入 @，后面直接写任务</div>' + rows.map(function (r) {
      return '<button type="button" data-insert="' + esc('@' + r.name + ' ') + '">' +
        '<span class="lc-mention-avatar">' + (r.bot ? '🤖' : esc(r.name.slice(0, 1))) + '</span>' +
        '<span class="lc-mention-body"><strong>' + esc(r.name) + '</strong><span>' + esc(r.sub) + '</span></span></button>'
    }).join('')
  }
  function openPop(name) {
    var wasOpen = ui.pop === name
    closePop()
    if (wasOpen) return
    ui.pop = name
    var emoji = ['😀', '😄', '😊', '🥰', '😉', '😍', '🤔', '😅', '😂', '🥳', '👍', '👏', '🙌', '💪', '🙏', '✨', '🎉', '🚀', '💡', '✅', '❤️', '🔥', '👀', '📡']
    var quick = ['收到 👌 我看一下就回你', '在吗？方便一起看个问题吗？', '我这边窗口开着，随时喊我', '好，就这么定 ✨']
    var pop = name === 'emoji' ? $('lcEmojiPop') : name === 'quick' ? $('lcQuickPop') : $('lcMentionPop')
    var button = lcTools.querySelector('[data-tool="' + name + '"]')
    pop.innerHTML = name === 'emoji'
      ? emoji.map(function (e) { return '<button type="button" data-insert="' + esc(e) + '">' + e + '</button>' }).join('')
      : name === 'quick'
        ? quick.map(function (q) { return '<button type="button" data-insert="' + esc(q) + '">' + esc(q) + '</button>' }).join('')
        : mentionHtml()
    pop.hidden = false
    if (button) button.classList.add('on')
  }
  function insertText(text) {
    var input = $('lcInput')
    input.value += (input.value && !/\s$/.test(input.value) ? ' ' : '') + text
    input.focus(); autoHeight(); syncSend()
  }
  function autoHeight() {
    var input = $('lcInput')
    input.style.height = 'auto'
    input.style.height = Math.min(120, Math.max(34, input.scrollHeight)) + 'px'
  }
  function sendCurrent() {
    var input = $('lcInput'), text = input.value.trim(), conv = activeConv()
    if (!text || !conv) return
    input.value = ''; autoHeight(); closePop(); syncSend()
    backend.send(conv.id, text).catch(function (e) { toast('发送失败：' + e.message) })
  }
  function openConversation(id) {
    if (ui.activeId !== id) ui.show = MESSAGE_WINDOW
    ui.activeId = id
    backend.markRead(id)
    render()
  }
  function openPeer(peerId) {
    var existing = (S.conversations || []).find(function (c) { return c.peerId === peerId })
    if (existing) return openConversation(existing.id)
    backend.createConversation({ kind: 'direct', peerId: peerId }).then(function (id) {
      if (id) openConversation(id)
    }).catch(function (e) { toast('无法建立私聊：' + e.message) })
  }

  $('lcTabs').addEventListener('click', function (e) {
    var button = e.target.closest('[data-tab]'); if (!button) return
    ui.tab = button.dataset.tab; render()
  })
  $('lcList').addEventListener('click', function (e) {
    var conv = e.target.closest('[data-conv]'), peer = e.target.closest('[data-peer]')
    if (conv) openConversation(conv.dataset.conv)
    else if (peer) openPeer(peer.dataset.peer)
  })
  $('lcSearch').addEventListener('input', function (e) { ui.query = e.target.value.trim(); render() })
  $('lcInput').addEventListener('input', function () { autoHeight(); syncSend() })
  $('lcInput').addEventListener('keydown', function (e) {
    // 选词回车由输入法处理；229 兼容仍用旧键码标记合成输入的环境。
    if (e.isComposing || e.keyCode === 229) return
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendCurrent() }
  })
  $('lcSend').addEventListener('click', sendCurrent)
  $('lcMessages').addEventListener('click', function (e) {
    var more = e.target.closest('[data-action="more"]')
    if (more) {
      var box = $('lcMessages')
      var fromBottom = box.scrollHeight - box.scrollTop
      ui.show += MESSAGE_WINDOW
      renderMessages({ force: true, fromBottom: fromBottom })
      return
    }
    var copy = e.target.closest('.lc-code-copy')
    if (!copy) return
    var holder = copy.closest('.lc-code')
    var code = holder && holder.querySelector('pre code')
    var restore = function () { copy.textContent = '复制' }
    if (!navigator.clipboard || !navigator.clipboard.writeText) { toast('当前环境不支持复制'); return }
    navigator.clipboard.writeText(code ? code.textContent : '').then(function () {
      copy.textContent = '已复制'; setTimeout(restore, 1400)
    }, function () { toast('复制失败，请手动选择文本') })
  })
  lcTools.addEventListener('click', function (e) {
    var button = e.target.closest('[data-tool]'); if (!button) return
    openPop(button.dataset.tool)
  })
  for (var pop of [$('lcEmojiPop'), $('lcQuickPop'), $('lcMentionPop')]) pop.addEventListener('click', function (e) {
    var button = e.target.closest('[data-insert]'); if (!button) return
    insertText(button.dataset.insert); closePop()
  })
  $('lcChatHead').addEventListener('click', function (e) {
    var button = e.target.closest('[data-action]'); if (!button) return
    if (button.dataset.action === 'search') $('lcSearch').focus()
    if (button.dataset.action === 'detail') { ui.detailHidden = !ui.detailHidden; render() }
    if (button.dataset.action === 'refresh') backend.refresh().then(function () { toast('状态已刷新') }).catch(function () {})
  })

  /* --------------- 模型 ⇄ dsh 会话：绑定、换新、解绑 --------------- */

  function closeSessionPop() { $('lcSessionPop').hidden = true }

  function openSessionPicker(botId) {
    var pop = $('lcSessionPop')
    pop.innerHTML = '<div class="lc-pop-title">绑定到一个 dsh 会话</div><div class="lc-session-loading">正在读取会话列表…</div>'
    pop.hidden = false
    var close = function (html) { pop.innerHTML = '<div class="lc-pop-title">绑定到一个 dsh 会话</div>' + html }
    backend.botSessions().then(function (data) {
      var items = (data && data.items) || []
      if (!items.length) {
        close('<div class="lc-session-loading">' + (data && data.available === false
          ? '这个环境读不到 dsh 会话列表（独立模式没有宿主）' : 'dsh 里还没有别的会话') + '</div>')
        return
      }
      close(items.map(function (item) {
        return '<button type="button" class="lc-session-row" data-bind="' + esc(item.id) + '" data-bot="' + esc(botId) + '">' +
          '<span class="lc-session-row-id">' + esc(shortSessionId(item.id)) + '</span>' +
          '<span class="lc-session-row-meta">' + (item.blank ? '空会话' : '有内容') +
          (item.botId ? ' · 已被 ' + esc(item.botId.replace('bot:', '')) + ' 占用' : '') + '</span></button>'
      }).join(''))
    }, function (error) { close('<div class="lc-session-loading">读取失败：' + esc(error.message) + '</div>') })
  }

  $('lcDetail').addEventListener('click', function (e) {
    var button = e.target.closest('[data-action]'); if (!button) return
    var botId = button.dataset.bot
    if (button.dataset.action === 'copy-diagnostics') { copyDiagnostics(); return }
    if (button.dataset.action === 'group-settings') { openGroupSettingsModal(); return }
    if (button.dataset.action === 'bot-session-pick') { openSessionPicker(botId); return }
    if (button.dataset.action === 'bot-session-new') {
      toast('正在新建 dsh 会话…')
      backend.newBotSession(botId, ui.activeId).then(function (data) {
        toast(data && data.sessionId ? '已换到新会话 ' + shortSessionId(data.sessionId) : '已新建会话')
        render()
      }).catch(function (error) { toast('新建失败：' + error.message) })
      return
    }
    if (button.dataset.action === 'bot-session-clear') {
      backend.bindBot(botId, '').then(function () { toast('已解绑，下次派活会重新建会话'); render() })
        .catch(function (error) { toast('解绑失败：' + error.message) })
    }
  })

  $('lcSessionPop').addEventListener('click', function (e) {
    var button = e.target.closest('[data-bind]'); if (!button) return
    var sessionId = button.dataset.bind
    backend.bindBot(button.dataset.bot, sessionId).then(function () {
      closeSessionPop()
      toast('已绑定到会话 ' + shortSessionId(sessionId))
      render()
    }).catch(function (error) { toast('绑定失败：' + error.message) })
  })

  document.addEventListener('click', function (e) {
    if ($('lcSessionPop').hidden) return
    if (e.target.closest('#lcSessionPop') || e.target.closest('[data-action="bot-session-pick"]')) return
    closeSessionPop()
  })

  /* 模态：新建群聊 / 修改昵称 */
  function closeModal() { $('lcModalRoot').hidden = true; $('lcModalRoot').innerHTML = '' }
  function openGroupModal() {
    var peers = (S.peers || []).filter(function (p) { return p.online })
    var bots = S.bots || []
    ui.selected = new Set()
    ui.selectedBots = new Set()
    $('lcModalRoot').innerHTML = '<div class="lc-modal"><h3>新建群聊</h3><p>选择设备成员；模型好友默认不加入，需要时单独邀请。</p>' +
      '<input class="lc-field" id="lcGroupName" placeholder="群聊名称，例如：交付小组" maxlength="30" />' +
      '<label class="lc-modal-label">选择成员 · ' + peers.length + ' 人在线</label>' +
      '<div class="lc-check-list" id="lcGroupMembers">' + (peers.length ? peers.map(function (p) {
        return '<button type="button" class="lc-check" data-member="' + esc(p.id) + '"><span class="lc-check-box">✓</span>' +
          avatarHtml(p.name.slice(0, 1), toneOf(p.id), 'sm') +
          '<span class="lc-check-body"><strong>' + esc(p.name) + '</strong><span>' + esc(p.machine) + ' · ' + esc(p.ip) + '</span></span></button>'
      }).join('') : '<div class="lc-empty">暂无在线设备成员</div>') + '</div>' +
      '<label class="lc-modal-label">邀请模型好友 · ' + bots.length + ' 个（默认不选）</label>' +
      '<div class="lc-check-list" id="lcGroupBots">' + (bots.length ? bots.map(function (bot) {
        return '<button type="button" class="lc-check" data-bot-member="' + esc(bot.id) + '"><span class="lc-check-box">✓</span>' +
          avatarHtml('🤖', 'blue', 'sm') + '<span class="lc-check-body"><strong>' + esc(bot.name) +
          '</strong><span>' + esc(bot.provider + '/' + bot.model) + '</span></span></button>'
      }).join('') : '<div class="lc-empty">本机尚未配置模型好友</div>') + '</div>' +
      '<label class="lc-setting-check"><input id="lcAllowOthersMention" type="checkbox" /><span><strong>允许其他群成员 @ 已邀请的模型好友</strong><small>默认关闭；开启后由模型所在设备处理 @ 消息。</small></span></label>' +
      '<div class="lc-modal-actions"><button class="lc-btn" type="button" data-modal="cancel">取消</button>' +
      '<button class="lc-btn primary" type="button" data-modal="create">创建群聊</button></div></div>'
    $('lcModalRoot').hidden = false
    $('lcGroupName').focus()
  }
  function openGroupSettingsModal() {
    var conv = activeConv()
    if (!conv || conv.kind !== 'group') return
    ui.selectedBots = new Set()
    var members = new Set((conv.botMembers || []).map(function (bot) { return bot.id }))
    var available = (S.bots || []).filter(function (bot) { return !members.has(bot.id) })
    var invited = (conv.botMembers || []).map(function (bot) {
      return '<div class="lc-group-invited"><span>🤖</span><strong>' + esc(bot.name) + '</strong><small>已加入群聊</small></div>'
    }).join('')
    $('lcModalRoot').innerHTML = '<div class="lc-modal"><h3>群聊设置 · ' + esc(conv.name) + '</h3>' +
      '<p>模型好友需要显式邀请。是否允许其他群成员 @ 模型也由这里控制。</p>' +
      (invited ? '<label class="lc-modal-label">已加入的模型好友</label>' + invited : '') +
      '<label class="lc-modal-label">邀请本机模型好友</label>' +
      '<div class="lc-check-list">' + (available.length ? available.map(function (bot) {
        return '<button type="button" class="lc-check" data-bot-member="' + esc(bot.id) + '"><span class="lc-check-box">✓</span>' +
          avatarHtml('🤖', 'blue', 'sm') + '<span class="lc-check-body"><strong>' + esc(bot.name) +
          '</strong><span>' + esc(bot.provider + '/' + bot.model) + '</span></span></button>'
      }).join('') : '<div class="lc-empty">没有可邀请的新模型好友</div>') + '</div>' +
      '<label class="lc-setting-check"><input id="lcAllowOthersMention" type="checkbox" ' + (conv.allowOthersMention ? 'checked' : '') + ' />' +
      '<span><strong>允许其他群成员 @ 已邀请的模型好友</strong><small>关闭时只有模型所在设备的用户可以 @ 它。</small></span></label>' +
      '<div class="lc-modal-actions"><button class="lc-btn" type="button" data-modal="cancel">取消</button>' +
      '<button class="lc-btn primary" type="button" data-modal="save-group-settings">保存设置</button></div></div>'
    $('lcModalRoot').hidden = false
  }
  function openProfileModal() {
    $('lcModalRoot').innerHTML = '<div class="lc-modal"><h3>我的昵称</h3><p>局域网里的其它人会看到这个名字，随时可以改。</p>' +
      '<input class="lc-field" id="lcNickInput" maxlength="24" value="' + esc(S.me.nickname || '') + '" />' +
      '<div class="lc-modal-actions"><button class="lc-btn" type="button" data-modal="cancel">取消</button>' +
      '<button class="lc-btn primary" type="button" data-modal="save">保存</button></div></div>'
    $('lcModalRoot').hidden = false
    $('lcNickInput').focus(); $('lcNickInput').select()
  }
  $('lcNewGroup').addEventListener('click', openGroupModal)
  $('lcMe').addEventListener('click', openProfileModal)
  $('lcModalRoot').addEventListener('click', function (e) {
    if (e.target === $('lcModalRoot')) return closeModal()
    var member = e.target.closest('[data-member]')
    if (member) {
      var id = member.dataset.member
      if (ui.selected.has(id)) ui.selected.delete(id); else ui.selected.add(id)
      member.classList.toggle('on', ui.selected.has(id))
      return
    }
    var botMember = e.target.closest('[data-bot-member]')
    if (botMember) {
      var botId = botMember.dataset.botMember
      if (ui.selectedBots.has(botId)) ui.selectedBots.delete(botId); else ui.selectedBots.add(botId)
      botMember.classList.toggle('on', ui.selectedBots.has(botId))
      return
    }
    var action = e.target.closest('[data-modal]'); if (!action) return
    if (action.dataset.modal === 'cancel') return closeModal()
    if (action.dataset.modal === 'save') {
      var nickname = $('lcNickInput').value.trim()
      if (!nickname) return toast('昵称不能为空')
      backend.setProfile(nickname).then(function () { closeModal(); toast('昵称已更新') }).catch(function (err) { toast('保存失败：' + err.message) })
      return
    }
    if (action.dataset.modal === 'save-group-settings') {
      var group = activeConv()
      if (!group || group.kind !== 'group') return closeModal()
      backend.updateGroup({ conversationId: group.id, botIds: Array.from(ui.selectedBots),
        allowOthersMention: $('lcAllowOthersMention').checked }).then(function () {
        closeModal(); toast('群聊设置已保存')
      }).catch(function (err) { toast('保存失败：' + err.message) })
      return
    }
    if (action.dataset.modal === 'create') {
      var name = $('lcGroupName').value.trim()
      if (!name) return toast('给群聊起个名字吧')
      if (!ui.selected.size && !ui.selectedBots.size) return toast('至少选择一位成员或模型好友')
      backend.createConversation({ kind: 'group', name: name, memberIds: Array.from(ui.selected),
        botIds: Array.from(ui.selectedBots), allowOthersMention: $('lcAllowOthersMention').checked }).then(function (id) {
        closeModal(); if (id) openConversation(id); toast('群聊「' + name + '」已创建')
      }).catch(function (err) { toast('创建失败：' + err.message) })
    }
  })

  /* 原型窗口控制（只在 demo 模式生效） */
  function restoreWindow() {
    document.body.classList.remove('lc-win-min', 'lc-win-closed')
    $('lcTaskbarApp').classList.remove('is-min')
  }
  if (DEMO) {
    $('lcTitlebar').addEventListener('click', function (e) {
      var button = e.target.closest('[data-win]'); if (!button) return
      var action = button.dataset.win
      if (action === 'min') { document.body.classList.add('lc-win-min'); $('lcTaskbarApp').classList.add('is-min') }
      if (action === 'max') document.body.classList.toggle('lc-win-max')
      if (action === 'close') { document.body.classList.add('lc-win-closed'); $('lcTaskbarApp').classList.add('is-min') }
    })
    $('lcTitlebar').addEventListener('dblclick', function (e) { if (!e.target.closest('button')) document.body.classList.toggle('lc-win-max') })
    $('lcTaskbarApp').addEventListener('click', restoreWindow)
    $('lcDesktopIcon').addEventListener('dblclick', restoreWindow)
    var tick = function () {
      var now = new Date()
      $('lcClockTime').textContent = clock(now.getTime())
      $('lcClockDate').textContent = now.getFullYear() + '/' + (now.getMonth() + 1) + '/' + now.getDate()
    }
    tick(); setInterval(tick, 15000)
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closePop(); closeModal() }
    if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('lcSearch').focus() }
  })
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.lc-pop') && !e.target.closest('.lc-tools') && ui.pop) closePop()
  })

  /* 贴着底部看的时候，窗口变矮 / 输入框长高都不该把最新一条顶出去 */
  var msgBox = $('lcMessages'), pinnedToBottom = true
  msgBox.addEventListener('scroll', function () {
    pinnedToBottom = msgBox.scrollHeight - msgBox.scrollTop - msgBox.clientHeight < 40
  }, { passive: true })
  if (window.ResizeObserver) {
    new ResizeObserver(function () {
      if (!pinnedToBottom) return
      // 必须显式 instant：写 scrollTop 会被 CSS 的 smooth 接管，
      // 动画途中的 scroll 事件会把自己判成「用户已经离开底部」，于是再也不回底
      msgBox.scrollTo({ top: msgBox.scrollHeight, behavior: 'instant' })
    }).observe(msgBox)
  }

  backend.start()
  window.addEventListener('beforeunload', function () { backend.dispose() })
})()

</script>
</body>
</html>
